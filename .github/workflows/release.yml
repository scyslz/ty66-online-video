name: Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (linux/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # 项目只用标准库，没有 go.sum 可缓存
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件需要 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          version="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            version="dev-${GITHUB_SHA::7}"
          fi
          out="dist/ty66-online-video-linux-${{ matrix.goarch }}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$out" .
          ls -lh "$out"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ty66-online-video-linux-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: 最新构建
          body: |
            由 `${{ github.sha }}` 自动构建（`${{ github.ref_name }}`）。

            仅提供 Linux 二进制：

            | 架构 | 文件 |
            |---|---|
            | x86_64 | `ty66-online-video-linux-amd64` |
            | arm64 | `ty66-online-video-linux-arm64` |

            ```bash
            chmod +x ty66-online-video-linux-amd64
            ./ty66-online-video-linux-amd64 -addr :8000
            # 浏览器打开 http://localhost:8000
            ```
          files: dist/*
          make_latest: true

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
